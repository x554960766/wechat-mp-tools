# 公众号 + RSS 服务（默认形态）
#
#   cd deploy/docker
#   cp .env.example .env
#   mkdir -p data
#   docker compose up -d --build
#   浏览器打开 http://<服务器IP>:5200
#
# 要全功能版（含抖音/快手/小红书/B站/转码），改 .env：
#   DOCKERFILE=deploy/docker/Dockerfile.full
#   IMAGE=wechat-mp-tools-full:latest
#   MEMORY_LIMIT=2g
# 然后重新 up -d --build。

name: wechat-mp-rss

services:
  app:
    build:
      context: ../..
      # 默认公众号版；改成 Dockerfile.full 即全功能版
      dockerfile: ${DOCKERFILE:-deploy/docker/Dockerfile}
      args:
        # 0 = 默认精简镜像（无 Chromium / 无 ffmpeg，公众号抓取与 RSS 不受影响）
        # 1 = 带 Chromium，PDF 导出与风控兜底可用，体积大 1.5GB
        INSTALL_BROWSERS: "${INSTALL_BROWSERS:-0}"
    image: ${IMAGE:-wechat-mp-tools-mp:latest}
    container_name: wechat-mp-rss
    restart: unless-stopped
    # 启用容器内置 init 进程 (tini)，负责信号转发与 Chrome/Crashpad 孤儿僵尸进程的自动回收
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "5200"
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      # 宿主机上 ./data 对应的路径，仅用于「打开文件夹」时的提示文案
      HOST_DATA_DIR: ${HOST_DATA_DIR:-./data}
      # 可选：强制指定容器内下载目录（默认 /app/data/articles_full）
      # 迁移旧数据时，若设置里记的是别的机器路径，会自动回落到这里
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-}
      # RSS：不设则读 data/app_settings.json，再退回代码默认值
      RSS_MAX_ITEMS: ${RSS_MAX_ITEMS:-0}
      RSS_CACHE_TTL: ${RSS_CACHE_TTL:-300}
      RSS_TOKEN: ${RSS_TOKEN:-}
      RSS_BASE_URL: ${RSS_BASE_URL:-}
      RSS_LOCAL_AVATAR: ${RSS_LOCAL_AVATAR:-1}
      RSS_AVATAR_FROM_ARTICLE: ${RSS_AVATAR_FROM_ARTICLE:-1}
      # 可选：Web 管理后台访问密码（留空免密；设置后开启 HTTP Basic 认证，防公网未授权访问）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 数据库存储引擎配置（默认 sqlite 零配置落盘至 ./data/wechat_tools.db）
      # 若连接外部或下方容器内 MySQL，设为 DB_TYPE=mysql
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-wechat_tools}
    ports:
      # 默认只绑本机，配合 Nginx 反代；要局域网直连改成 0.0.0.0
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-5200}:5200"
    volumes:
      # 唯一需要持久化的目录：设置、账号 cookie、下载历史、RSS 缓存、已下载文章、SQLite 数据库文件
      - ./data:/app/data
      # 想把文章落到独立磁盘时，把设置里的 download_dir 改成 /downloads 再启用：
      # - ${DOWNLOAD_DIR:-./downloads}:/downloads
    # 默认 root 运行，避免绑定挂载的属主问题。
    # 需要非 root 时取消注释，并先 sudo chown -R 1000:1000 ./data
    # 注意：非 root 下 Chrome 沙箱仍可能不可用，PDF 导出可能失败
    # user: "${PUID:-1000}:${PGID:-1000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5200/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-1g}

  # 可选：由 Docker Compose 一键附带运行独立的 MySQL 8 数据库服务
  # 启动命令：docker compose --profile with-mysql up -d
  # 在 .env 中配合设置：DB_TYPE=mysql, DB_HOST=db, DB_USER=wechat, DB_PASSWORD=wechat123456
  db:
    image: mysql:8.0
    container_name: wechat-mp-mysql
    restart: unless-stopped
    profiles: ["with-mysql"]
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-wechat_tools}
      MYSQL_USER: ${DB_USER:-wechat}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wechat123456}
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
