[project]
name = "ai-media"
version = "0.1.0"
description = "公众号归档与图片语义检索"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "playwright>=1.55,<2",
  "pillow>=11,<13",
  "pillow-heif>=1.1,<2",
  "numpy>=2,<3",
  "torch>=2.5,<3",
  "transformers>=4.45,<5",
  "python-multipart>=0.0.18,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
review = ["onnxruntime>=1.20,<2"]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
