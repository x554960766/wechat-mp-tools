<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ai-media · 归档与检索</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#101820;color:#e9f0f3}*{box-sizing:border-box}body{margin:0}header{padding:28px max(24px,calc((100vw - 1200px)/2));border-bottom:1px solid #34434a;background:#17232c}h1{margin:0 0 12px;font-size:28px}p{color:#b6c9ce}main{max-width:1200px;margin:auto;padding:24px}button,input,textarea,select{font:inherit}button{border:1px solid #526b70;background:#253c43;color:#f6fbfa;border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:#335961}button:disabled{opacity:.5;cursor:default}button.small{padding:4px 9px;font-size:12px;margin-left:6px}input,textarea,select{background:#18282f;color:#f6fbfa;border:1px solid #526b70;border-radius:8px;padding:10px}textarea{width:100%;min-height:150px}input[type=search]{width:min(100%,480px)}.tabs{display:flex;gap:8px}.tabs button[aria-selected=true]{background:#197b73;border-color:#42b6a5}.panel{display:none}.panel.active{display:block}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}.card{background:#192831;border:1px solid #34434a;border-radius:12px;padding:18px;margin:16px 0}.hint{font-size:13px;color:#a8b9bd}.status{min-height:24px;color:#d9c98a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}.tile{background:#1b2c33;border:1px solid #34434a;border-radius:10px;overflow:hidden}.tile img{width:100%;height:180px;object-fit:cover;cursor:pointer}.tile div{padding:10px;font-size:13px;overflow-wrap:anywhere}.tile a{color:#90d8cf}dialog{max-width:min(94vw,1000px);background:#10202a;color:#fff;border:1px solid #526b70;border-radius:12px}dialog img{max-width:88vw;max-height:75vh;display:block;margin:auto}.chips label{margin-right:12px}small{color:#a8b9bd}.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;background:#2b4a52;color:#cfe6e2;margin:0 4px 4px 0}.badge.warn{background:#5a3a22;color:#ffd9b0}.dropzone.dragover{outline:2px dashed #42b6a5;outline-offset:-8px;background:#1d343b}.failures{margin:8px 0 0;padding-left:18px;font-size:13px;color:#c9d6d9;max-height:200px;overflow:auto}
</style>
</head>
<body>
<header><h1>ai-media</h1><p>公众号归档与图片语义检索</p><nav class="tabs" aria-label="功能"><button id="tab-archive" aria-selected="true">归档</button><button id="tab-search" aria-selected="false">检索</button></nav></header>
<main>
<section id="archive" class="panel active"><div class="card"><h2>新建归档任务</h2><p class="hint">粘贴公众号链接，每行一个。任务上传后的本地原件保留 7 天；清理前会再次核对远端内容。</p><textarea id="links" placeholder="https://mp.weixin.qq.com/s/..."></textarea><div class="row"><label>目标根 <select id="target-root"></select></label><label>子目录 <input id="target-dir" placeholder="可选"></label><button id="submit-links">开始归档</button></div><div class="row"><label>上传 txt / csv / zip <input id="archive-file" type="file" accept=".txt,.csv,.zip"></label><button id="submit-file">上传并归档</button></div><p id="archive-status" class="status" role="status"></p></div><div class="card"><h2>从公众号归档</h2><p class="hint">旁挂 wechat-mp-tools 需先运行在 127.0.0.1:5200 并完成扫码登录；这里只取它的文章链接，正文抓取、去重、落盘沿用上面的归档链路。</p><div class="row"><label>公众号 <select id="mp-account"><option value="">加载中…</option></select></label><label>取最近 <input id="mp-count" type="number" min="1" max="500" value="5" style="width:90px"> 篇</label><button id="refresh-mp">刷新公众号</button><button id="submit-mp">从公众号归档</button></div><p id="mp-status" class="status" role="status"></p></div><div class="card"><h2>任务</h2><button id="refresh-jobs">刷新任务</button><p class="hint">「恢复未完成任务」用于中断/失败后继续原任务；「重新抓取」对该篇新建任务，用于原文内容更新后重抓。</p><div id="jobs"></div></div></section>
<section id="search" class="panel"><div class="card"><h2>检索图片</h2><div class="row"><input id="query" type="search" placeholder="例如：海边 日落"><input id="negative" placeholder="排除词（软降权）"><button id="search-text">搜索</button></div><div class="row"><label>以图搜图 <input id="query-image" type="file" accept="image/*,.heic,.heif"></label><button id="search-image">查找相似</button><span class="hint">也可把图片拖进本页</span></div><div class="row"><label>首次入库起 <input id="after" type="date"></label><label>至 <input id="before" type="date"></label><label><input id="review" type="checkbox"> NSFW 审查</label></div><div id="root-chips" class="chips"></div><p class="hint">日期按首次入库时间筛选；排除词只降低排序分数，不保证完全排除。</p><p id="offline-roots" class="hint"></p><p id="search-status" class="status" role="status"></p></div><div class="card"><h2>扫描媒体根</h2><div class="row"><select id="scan-root"></select><button id="start-scan">开始扫描</button><button id="cancel-scan" disabled>取消扫描</button><button id="refresh-failures">刷新隔离项</button></div><p id="scan-status" role="status"></p><ul id="failures" class="failures"></ul></div><div id="results" class="grid"></div></section>
</main>
<dialog id="lightbox"><div class="row"><button id="prev">上一张</button><button id="next">下一张</button><button id="close">关闭</button></div><img id="lightbox-image" alt="检索结果原图"><p id="lightbox-detail"></p></dialog>
<script>
const $=id=>document.getElementById(id);let items=[],position=0,activeScan=null;
const STORE_KEY='ai-media:query';
async function api(url,opts){const r=await fetch(url,opts),type=r.headers.get('content-type')||'',body=type.includes('json')?await r.json():null;if(!r.ok)throw Error(body?.error?.message||`请求失败 (${r.status})`);return body}
function status(id,msg){$(id).textContent=msg}
function badge(text,warn){const b=document.createElement('span');b.className='badge'+(warn?' warn':'');b.textContent=text;return b}
function tab(name){for(const n of ['archive','search']){$(n).classList.toggle('active',n===name);$('tab-'+n).setAttribute('aria-selected',String(n===name))}}$('tab-archive').onclick=()=>tab('archive');$('tab-search').onclick=()=>tab('search');
function selectedRoots(){return [...document.querySelectorAll('#root-chips input:checked')].map(x=>x.value)}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify({q:$('query').value,neg:$('negative').value,after:$('after').value,before:$('before').value,roots:selectedRoots(),review:$('review').checked}))}catch(e){/* 隐私模式下忽略 */}}
function restoreState(){let s=null;try{s=JSON.parse(localStorage.getItem(STORE_KEY)||'null')}catch(e){}if(!s)return;$('query').value=s.q||'';$('negative').value=s.neg||'';$('after').value=s.after||'';$('before').value=s.before||'';$('review').checked=!!s.review;const want=new Set(s.roots||[]);for(const c of document.querySelectorAll('#root-chips input'))c.checked=want.has(c.value)}
async function roots(){try{const data=await api('/api/media/roots');const arr=Array.isArray(data)?data:(data.items||data.roots||[]);$('target-root').replaceChildren();$('scan-root').replaceChildren();$('root-chips').replaceChildren();for(const r of arr){const id=r.id||r.root,lab=r.name||id;for(const target of ['scan-root',...(r.writable?['target-root']:[])]){const o=document.createElement('option');o.value=id;o.textContent=lab;$(target).append(o)}const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.value=id;l.append(c,document.createTextNode(' '+lab));$('root-chips').append(l)}if(!$('target-root').options.length)status('archive-status','当前没有可写媒体根');restoreState()}catch(e){status('archive-status',e.message);status('search-status',e.message)}}
async function health(){try{const h=await api('/api/health');const m=h.model||{};if(m.state&&!['ready','unloaded','loading'].includes(m.state))status('search-status',`模型不可用：${m.error||m.state}`);const offline=(h.roots||[]).filter(r=>r.reachable===false).map(r=>r.name||r.id);$('offline-roots').textContent=offline.length?`当前离线：${offline.join('、')}（这些根的图片只能显示缓存预览）`:''}catch(e){}}
async function downloadJob(id){
  const response=await fetch(`/api/archive/jobs/${encodeURIComponent(id)}/download`);
  const type=response.headers.get('content-type')||'';
  if(!response.ok)throw Error((await response.json()).error?.message||`下载失败 (${response.status})`);
  if(response.status===202){const pending=await response.json();status('archive-status',`ZIP 正在恢复：${pending.export_id}`);await pollExport(pending.export_id);return}
  if(!type.includes('zip'))throw Error('导出返回了非 ZIP 内容');
  const url=URL.createObjectURL(await response.blob());const link=document.createElement('a');link.href=url;link.download=`ai-media-${id}.zip`;link.click();setTimeout(()=>URL.revokeObjectURL(url),30000)
}
async function pollExport(id){
  for(let attempt=0;attempt<120;attempt++){
    const result=await api(`/api/archive/exports/${encodeURIComponent(id)}`);
    if(result.status==='completed'){status('archive-status','ZIP 已就绪');const source=result.download_url.split('/')[4];await downloadJob(source);return}
    if(['failed','interrupted','cancelled'].includes(result.status))throw Error(result.error||'ZIP 导出失败');
    await new Promise(resolve=>setTimeout(resolve,2000))
  }
  throw Error('ZIP 仍在恢复，请稍后到任务列表重试下载')
}
async function refetch(job,article){
  const data=await api('/api/archive/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:article.url,target_root:job.target_root,target_dir:job.target_dir||''})});
  status('archive-status',`已为「${article.title||article.url}」新建任务 ${data.id}`);jobs()
}
async function jobs(){try{
  const data=await api('/api/archive/jobs?limit=20&offset=0');$('jobs').replaceChildren();
  for(const j of data.items||[]){
    const box=document.createElement('div');box.className='card';const title=document.createElement('div');title.textContent=`${j.id} · ${j.status} · ${j.phase||''}`;box.append(title);
    for(const article of j.articles||[]){const line=document.createElement('p');line.className='hint';line.textContent=`${article.title||article.url} · ${article.status} · 已入库 ${article.files?.length||0} 张`;if(article.url){const b=document.createElement('button');b.className='small';b.textContent='重新抓取';b.title='对这篇文章新建归档任务（原文更新后用）';b.onclick=async()=>{try{await refetch(j,article)}catch(e){status('archive-status',e.message)}};line.append(b)}box.append(line)}
    if(['failed','cancelled','partial','interrupted'].includes(j.status)){const b=document.createElement('button');b.textContent='恢复未完成任务';b.onclick=async()=>{try{await api(`/api/archive/jobs/${encodeURIComponent(j.id)}/retry`,{method:'POST'});jobs()}catch(e){status('archive-status',e.message)}};box.append(b)}
    if(j.status==='waiting_verification'){const b=document.createElement('button');b.textContent='打开人工验证窗口';b.onclick=async()=>{try{const x=await api(`/api/archive/jobs/${encodeURIComponent(j.id)}/verify`,{method:'POST'});status('archive-status',`验证窗口已打开（任务 ${x.id}），完成后刷新并恢复任务`)}catch(e){status('archive-status',e.message)}};box.append(b)}
    if(['completed','partial','interrupted'].includes(j.status)){const b=document.createElement('button');b.textContent='下载 ZIP';b.onclick=async()=>{try{await downloadJob(j.id)}catch(e){status('archive-status',e.message)}};box.append(b)}
    $('jobs').append(box)
  }
}catch(e){status('archive-status',e.message)}}
$('refresh-jobs').onclick=jobs;$('submit-links').onclick=async()=>{try{const data=await api('/api/archive/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('links').value,target_root:$('target-root').value,target_dir:$('target-dir').value})});status('archive-status',`任务 ${data.id}：${data.status}`);jobs()}catch(e){status('archive-status',e.message)}};
$('submit-file').onclick=async()=>{try{const f=$('archive-file').files[0];if(!f)throw Error('请选择文件');const fd=new FormData();fd.append('file',f);fd.append('target_root',$('target-root').value);fd.append('target_dir',$('target-dir').value);const data=await api('/api/archive/jobs/upload',{method:'POST',body:fd});status('archive-status',`任务 ${data.id}：${data.status}`);jobs()}catch(e){status('archive-status',e.message)}};
function options(){return {roots:selectedRoots(),after:$('after').value||null,before:$('before').value||null,k:24,review:$('review').checked}}
async function mpHealth(){try{const h=await api('/api/mp/health');if(h.status!=='ok')return `旁挂不可用：${h.message||h.code||h.status}`;if(h.logged_in===false)return `旁挂未登录：${h.login_message||'请到 5200 完成扫码'}`;if(h.logged_in===null)return '旁挂登录态未知';return ''}catch(e){return `旁挂探活失败：${e.message}`}}
async function mpAccounts(){const sel=$('mp-account');try{const warn=await mpHealth();const data=await api('/api/mp/accounts');const list=data.items||[];sel.replaceChildren();if(!list.length){const o=document.createElement('option');o.value='';o.textContent='没有可用公众号';sel.append(o);status('mp-status',warn||'旁挂没有返回任何已关注公众号');return}for(const a of list){const o=document.createElement('option');o.value=a.fakeid;o.textContent=a.nickname||a.fakeid;sel.append(o)}status('mp-status',warn||`已加载 ${list.length} 个公众号`)}catch(e){sel.replaceChildren();const o=document.createElement('option');o.value='';o.textContent='加载失败';sel.append(o);status('mp-status',e.message)}}
$('refresh-mp').onclick=mpAccounts;
$('submit-mp').onclick=async()=>{const fakeid=$('mp-account').value;if(!fakeid){status('mp-status','请先选择一个公众号');return}const count=Math.max(1,Math.min(500,Number($('mp-count').value)||5));try{status('mp-status','正在从旁挂取文章链接…');const data=await api('/api/archive/from-mp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fakeid,count,target_root:$('target-root').value,target_dir:$('target-dir').value})});status('archive-status',`任务 ${data.id}：${data.status} · 共 ${data.article_count} 篇`);status('mp-status',`已提交 ${data.article_count} 篇`);jobs()}catch(e){status('mp-status',e.message)}};
function tileMeta(x){const meta=document.createElement('div');const badges=document.createElement('div');
  if(x.origin==='legacy_import')badges.append(badge('旧库导入'));
  if(x.source_state==='offline')badges.append(badge('离线',true));
  if(x.preview_cached)badges.append(badge('缓存预览',true));
  if(badges.childNodes.length)meta.append(badges);
  const t=document.createElement('div');t.textContent=x.article?.title||x.relpath||'来源未知';meta.append(t);
  if(x.article?.published_at){const p=document.createElement('small');p.textContent=`发布 ${x.article.published_at}`;meta.append(p,document.createElement('br'))}
  const s=document.createElement('small');s.textContent=`${x.source_label||x.root||''} · 入库 ${x.ingested_at||'未知'} · ${x.source_state||'unknown'}`;meta.append(s);
  if(x.article?.url&&/^https:\/\/mp\.weixin\.qq\.com\//.test(x.article.url)){const a=document.createElement('a');a.href=x.article.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='查看原文';meta.append(document.createElement('br'),a)}
  return meta}
async function probeThumb(x,im){try{const r=await fetch(x.thumb);if(r.status===409)status('search-status','索引版本已变化，请重新搜索以刷新结果');else if(r.status===404)status('search-status','缩略图缺失，可重新扫描该媒体根补建');else if(r.status===503)status('search-status','源不可达（媒体根离线），仅缓存预览可用');else return;im.style.opacity=.35;im.alt='预览不可用'}catch(e){im.style.opacity=.35}}
function render(data){items=data.items||[];$('results').replaceChildren();if(items.length)status('search-status',`找到 ${items.length} 张图片`);else{status('search-status','没有匹配图片');emptyHint()}items.forEach((x,i)=>{const box=document.createElement('article');box.className='tile';const im=document.createElement('img');im.src=x.thumb;im.alt=x.article?.title||x.relpath||'图片';im.loading='lazy';im.onerror=()=>probeThumb(x,im);im.onclick=()=>open(i);box.append(im);box.append(tileMeta(x));$('results').append(box)})}
async function emptyHint(){try{const s=await api('/api/search/stats');if(!s.total)status('search-status','没有匹配图片。索引还是空的，请先在下面扫描媒体根。')}catch(e){}}
async function searchImage(file){if(!file)throw Error('请选择图片');const fd=new FormData();fd.append('file',file);for(const r of selectedRoots())fd.append('roots',r);const o=options();for(const [k,v] of Object.entries(o))if(k!=='roots'&&v!==null)fd.append(k,String(v));status('search-status','正在检索…');saveState();render(await api('/api/search/image',{method:'POST',body:fd}))}
$('search-text').onclick=async()=>{try{status('search-status','正在检索…');saveState();render(await api('/api/search/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:$('query').value,neg:$('negative').value,...options()})}))}catch(e){status('search-status',e.message)}};
$('search-image').onclick=async()=>{try{await searchImage($('query-image').files[0])}catch(e){status('search-status',e.message)}};
function bindDrop(el){el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dragover')});el.addEventListener('dragleave',e=>{if(e.target===el)el.classList.remove('dragover')});el.addEventListener('drop',async e=>{e.preventDefault();el.classList.remove('dragover');const f=e.dataTransfer?.files?.[0];if(!f)return;if(!/^image\//.test(f.type)&&!/\.(heic|heif)$/i.test(f.name)){status('search-status','只支持拖入图片文件');return}try{await searchImage(f)}catch(err){status('search-status',err.message)}})}
bindDrop($('search'));bindDrop($('results'));
function open(i){position=(i+items.length)%items.length;const x=items[position];const bits=[x.article?.title||x.relpath||''];if(x.article?.published_at)bits.push(`发布 ${x.article.published_at}`);bits.push(`拍摄 ${x.shot_at||'未知'}`);bits.push(x.source_state||'unknown');if(x.origin==='legacy_import')bits.push('旧库导入');const detail=bits.join(' · ');$('lightbox-detail').textContent=detail;$('lightbox-image').onerror=()=>{$('lightbox-image').alt='原图不可用';$('lightbox-detail').textContent=`${detail} · 原图不可用（源离线或版本已变化）`};$('lightbox-image').src=x.file;$('lightbox').showModal()}$('close').onclick=()=>$('lightbox').close();$('prev').onclick=()=>open(position-1);$('next').onclick=()=>open(position+1);document.addEventListener('keydown',e=>{if(!$('lightbox').open)return;if(e.key==='ArrowLeft')open(position-1);if(e.key==='ArrowRight')open(position+1)});
async function failures(){const root=$('scan-root').value,box=$('failures');box.replaceChildren();try{const data=await api(`/api/media/failures?limit=100${root?`&root=${encodeURIComponent(root)}`:''}`);const list=data.items||[];if(!list.length){const li=document.createElement('li');li.textContent='没有隔离图片';box.append(li);return}for(const f of list){const li=document.createElement('li');li.textContent=`${f.root}:${f.relpath} · ${f.last_error||'原因未知'}`;box.append(li)}}catch(e){const li=document.createElement('li');li.textContent=e.message;box.append(li)}}
$('refresh-failures').onclick=failures;$('scan-root').onchange=failures;
$('start-scan').onclick=async()=>{try{const d=await api('/api/media/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({root:$('scan-root').value,rebuild:false})});activeScan=d.id;$('cancel-scan').disabled=false;pollScan()}catch(e){status('scan-status',e.message)}};$('cancel-scan').onclick=async()=>{if(activeScan)await api(`/api/media/scans/${encodeURIComponent(activeScan)}/cancel`,{method:'POST'})};async function pollScan(){if(!activeScan)return;try{const d=await api(`/api/media/scans/${encodeURIComponent(activeScan)}`);status('scan-status',`${d.status} · 扫描 ${d.scanned||0} · 新增 ${d.indexed_new||0} · 失败 ${d.failed||0}`);if(['done','completed','failed','cancelled'].includes(d.status)){$('cancel-scan').disabled=true;activeScan=null;failures();return}setTimeout(pollScan,1500)}catch(e){status('scan-status',e.message)}}
roots().then(failures);jobs();health();mpAccounts();
</script></body></html>
